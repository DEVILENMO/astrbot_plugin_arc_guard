name: astrbot_plugin_arc_guard
display_name: 弧光护卫
desc: 可配置违禁词检测与累加禁言；独立屏蔽（限时/永久）；官方平台真禁言与命中自动撤回；图片 OCR；联动机器人违禁时连坐其 @ 的人；支持求饶减刑；管理工具仅超级管理员可用
short_desc: 弧光护卫违禁词禁言
help: |
  自动检测群成员发言、群名片、图片 OCR 文字、@ 对象群名片与 AI 回复中的违禁关键词
  （忽略大小写与分隔符；希腊文/西里尔文等形似字同样计入）。
  关键词可在配置 forbidden_keywords 中逐项添加；单项内空格表示「同时出现」组合
  （如 sb enmo），默认 sb enmo。
  AI 回复命中时拦截原文、改为警告，并禁言对话对象（白名单仍不禁言，但原文照样拦截）。
  经弧光消息中枢的 Minecraft AI（弧光天星）回复同样检测。

  出现几次就禁言几分钟。白名单 QQ（默认 593405016）发言不处理。
  所有禁言均为累加（剩余时间 + 新增时间），不会用短禁言顶掉长禁言。
  禁言与屏蔽相互独立：禁言失败只返回失败原因，不会自动变成屏蔽。
  屏蔽 = 机器人不再回复其聊天，但仍检测违禁词并照常禁言。
  限时屏蔽只作用于当前群，可求饶减时；永久屏蔽在所有群和私聊生效，求饶无效。
  跨插件 mute_user / mute_user_in_group（支持 respect_whitelist）/ unmute_user / unmute_user_in_group。
  所有 LLM 工具仅超级管理员（AstrBot 管理员 admins_id）可用，发起人不是超级管理员时直接拒绝：
  arc_mute_user 追加禁言；arc_unmute_user 解除禁言；arc_shield_user 屏蔽（minutes 限时或 permanent 永久）；
  arc_unshield_user 取消屏蔽；arc_recall_user_messages 撤回其最近几条消息（官方平台限 2 分钟内）；
  arc_register_bot / arc_unregister_bot 维护联动机器人名单（持久化到配置，官方 openid 与 QQ 号均可）。
  真禁言支持 aiocqhttp（OneBot set_group_ban）与 qq_official（机器人为群管理员时走官方
  restrict_chat_setting 接口，上限 30 天、仅普通成员）；其它平台无原生禁言时无法禁言。
  命中违禁词自动撤回消息（recall_on_hit）：qq_official 走官方撤回接口（发出超 2 分钟不可撤），
  aiocqhttp 走 delete_msg；撤回失败不影响警告与禁言。联动机器人发出的违禁消息同样撤回。
  图片 OCR：本地 RapidOCR（ocr_enabled 可开关）；透明图白底+黑底双扫防幻影坦克；超大图先缩到最长边 1920；黑底补方与四向旋转再扫。
  @ 检测：把被 @ 者的群名片替换/补进检测文本，防止「名片写违禁词 + 被人 @」绕过。
  机器人群名片守护：每秒检测；被改则强制改回 bot_group_card，并制裁操作者/配置名单。

  私聊求饶：配置 pardon_enabled 可开关；开启后私聊发送求饶台词可减刑。
  群内求饶：pardon_in_group 默认开启；群里发送同一台词可减免本群禁言/限时屏蔽
  （适合不支持私聊的平台）。

  连坐：联动机器人（配置 linked_bot_ids）若发出违禁内容，
  则禁言其消息里 @ 的人（次数 × 2 分钟，例如 10 次 → 20 分钟）。
  连坐名单可动态维护：超级管理员 @ 机器人说「@xx 把这个记录为机器人」即可写入名单。
version: 1.12.0
author: DEVILENMO
repo: https://github.com/DEVILENMO/astrbot_plugin_arc_guard
